name: Android Release

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/release.py detect

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Restore existing signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python .github/scripts/release.py signing
      - run: flutter pub get --enforce-lockfile
      - name: Build signed APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify and prepare release assets
        run: python .github/scripts/release.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: HoshiLedger-${{ needs.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py publish
      - name: Remove signing material
        if: always()
        run: python .github/scripts/release.py cleanup
